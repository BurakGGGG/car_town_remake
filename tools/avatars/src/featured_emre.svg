    <path d="M 196 246 Q 218 230 242 244 Q 220 256 196 246 Z" fill="#FFFFFF"/>
    <path d="M 270 244 Q 294 230 316 246 Q 292 256 270 244 Z" fill="#FFFFFF"/>
    <circle cx="221" cy="245" r="9.5" fill="#4A2C1C"/>
    <circle cx="293" cy="245" r="9.5" fill="#4A2C1C"/>
    <circle cx="221" cy="245" r="4.5" fill="#110A07"/>
    <circle cx="293" cy="245" r="4.5" fill="#110A07"/>
    <circle cx="225" cy="241" r="3" fill="#FFFFFF"/>
    <circle cx="297" cy="241" r="3" fill="#FFFFFF"/>
    <!-- ağır üst kapak -->
    <path d="M 194 246 Q 218 226 244 242 L 242 238 Q 218 224 196 240 Z" fill="#120E1A"/>
    <path d="M 268 242 Q 294 226 318 246 L 316 240 Q 294 224 270 238 Z" fill="#120E1A"/>
    <path d="M 194 246 Q 218 228 244 242" fill="none" stroke="#120E1A" stroke-width="6" stroke-linecap="round"/>
    <path d="M 268 242 Q 294 228 318 246" fill="none" stroke="#120E1A" stroke-width="6" stroke-linecap="round"/>
    <path d="M 204 254 Q 220 260 236 254" fill="none" stroke="#B57B5D" stroke-width="3" stroke-linecap="round"/>
    <path d="M 276 254 Q 292 260 308 254" fill="none" stroke="#B57B5D" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- KAŞLAR: sağ kaş hafif kalkık -->
  <path d="M 190 224 Q 214 204 244 214 L 243 224 Q 216 216 194 232 Z" fill="#17161D"/>
  <path d="M 268 212 Q 296 194 324 212 L 322 222 Q 296 206 270 222 Z" fill="#17161D"/>

  <!-- SAÇ: kenarlar kısa (fade), üstte yana taranmış perçem -->
  <path d="M 174 226 C 170 184, 176 152, 194 130 L 210 148 C 194 168, 188 196, 188 228 Z" fill="#33323C"/>
  <path d="M 338 226 C 342 184, 336 152, 318 130 L 302 148 C 318 168, 324 196, 324 228 Z" fill="#33323C"/>
  <path d="M 178 170 C 170 112, 212 70, 266 64 C 322 58, 368 88, 370 132 C 372 150, 360 160, 348 158 C 344 174, 338 186, 332 196 C 328 172, 318 154, 302 144 C 272 156, 232 156, 202 148 C 192 156, 184 164, 178 170 Z"
        fill="url(#hair)" stroke="#120E1A" stroke-width="6" stroke-linejoin="round"/>
  <g fill="none" stroke="#4A5878" stroke-width="5" stroke-linecap="round">
    <path d="M 206 104 Q 262 78 334 98"/>
    <path d="M 216 126 Q 270 108 348 128"/>
    <path d="M 232 142 Q 276 132 318 140"/>
  </g>

  <!-- NEON KENAR IŞIKLARI -->
  <g fill="none" stroke-linecap="round" stroke-width="5">
    <path d="M 173 208 C 172 252, 178 288, 194 316" stroke="#FF4FB8"/>
    <path d="M 182 166 C 178 128, 206 86, 250 74" stroke="#FF4FB8"/>
    <path d="M 339 208 C 340 252, 334 288, 318 316" stroke="#5CF2FF"/>
    <path d="M 365 134 C 364 148, 356 154, 348 154" stroke="#5CF2FF"/>
    <path d="M 357 246 C 360 258, 356 270, 350 278" stroke="#5CF2FF"/>
  </g>
</svg>
