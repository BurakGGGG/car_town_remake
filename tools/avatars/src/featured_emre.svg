<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- EMRE USTA — Gece Garajı: siyah deri ceket, kısa sakal, yana taranmış perçem, neon kenar ışığı
       (sol pembe, sağ camgöbeği). Oyunda daireye kırpılır: önemli her şey r=256 dairenin içinde. -->
  <defs>
    <radialGradient id="bg" cx="256" cy="210" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3D2C72"/>
      <stop offset="0.55" stop-color="#22184A"/>
      <stop offset="1" stop-color="#0D0A1F"/>
    </radialGradient>
    <linearGradient id="neck" x1="0" y1="330" x2="0" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8E5C44"/>
      <stop offset="1" stop-color="#C08566"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0" y1="400" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A2B35"/>
      <stop offset="1" stop-color="#15161C"/>
    </linearGradient>
    <linearGradient id="hair" x1="200" y1="60" x2="330" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2B2F3F"/>
      <stop offset="1" stop-color="#121218"/>
    </linearGradient>
  </defs>

  <!-- ARKA PLAN: gece, neon tabela çerçevesi (pembe) ve şimşek (camgöbeği) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#FF4FB8">
      <rect x="62" y="66" width="388" height="262" rx="46" stroke-width="34" opacity="0.10"/>
      <rect x="62" y="66" width="388" height="262" rx="46" stroke-width="18" opacity="0.22"/>
      <rect x="62" y="66" width="388" height="262" rx="46" stroke-width="7"/>
    </g>
    <rect x="62" y="66" width="388" height="262" rx="46" stroke="#FFD3EE" stroke-width="2.5"/>
    <g stroke="#5CF2FF">
      <path d="M 420 96 L 392 160 L 424 160 L 396 226" stroke-width="30" opacity="0.12"/>
      <path d="M 420 96 L 392 160 L 424 160 L 396 226" stroke-width="16" opacity="0.25"/>
      <path d="M 420 96 L 392 160 L 424 160 L 396 226" stroke-width="7"/>
    </g>
    <path d="M 420 96 L 392 160 L 424 160 L 396 226" stroke="#E2FDFF" stroke-width="2.5"/>
  </g>
  <g fill="#5CF2FF">
    <circle cx="96" cy="380" r="3"/>
    <circle cx="430" cy="300" r="2.5"/>
    <circle cx="110" cy="130" r="2.5" fill="#FF8FD0"/>
  </g>

  <!-- GÖVDE: tişört, açık deri ceket, kolye -->
  <g transform="translate(0,-14)">
  <g stroke="#120E1A" stroke-width="6" stroke-linejoin="round">
    <path d="M 184 404 Q 256 444 328 404 L 344 530 L 168 530 Z" fill="#30333F"/>
    <path d="M 22 530 C 30 452, 96 420, 188 402 L 214 426 L 240 530 Z" fill="url(#jacket)"/>
    <path d="M 490 530 C 482 452, 416 420, 324 402 L 298 426 L 272 530 Z" fill="url(#jacket)"/>
    <!-- yakalar -->
    <path d="M 190 402 L 146 444 L 192 458 L 232 530 L 214 426 Z" fill="#2F313C"/>
    <path d="M 322 402 L 366 444 L 320 458 L 280 530 L 298 426 Z" fill="#2F313C"/>
  </g>
  <path d="M 216 412 Q 256 446 296 412" fill="none" stroke="#454A5E" stroke-width="7" stroke-linecap="round"/>
  <path d="M 226 424 Q 256 462 286 424" fill="none" stroke="#C9CED8" stroke-width="3"/>
  <rect x="249" y="450" width="14" height="20" rx="3" fill="#C9CED8" stroke="#120E1A" stroke-width="2.5"/>
  <circle cx="152" cy="442" r="5" fill="#C9CED8"/>
  <circle cx="360" cy="442" r="5" fill="#C9CED8"/>
  <!-- deri parlaması + neon kenarlar -->
  <path d="M 72 470 Q 110 434 172 418" fill="none" stroke="#4C5163" stroke-width="6" stroke-linecap="round"/>
  <path d="M 440 470 Q 402 434 340 418" fill="none" stroke="#4C5163" stroke-width="6" stroke-linecap="round"/>
  <path d="M 34 512 Q 50 452 140 424" fill="none" stroke="#FF4FB8" stroke-width="5" stroke-linecap="round"/>
  <path d="M 478 512 Q 462 452 372 424" fill="none" stroke="#5CF2FF" stroke-width="5" stroke-linecap="round"/>

  <!-- BOYUN -->
  <path d="M 216 320 L 216 424 Q 256 446 296 424 L 296 320 Z" fill="url(#neck)" stroke="#120E1A" stroke-width="6"/>
  </g>

  <!-- KULAKLAR -->
  <g stroke="#120E1A" stroke-width="6">
    <ellipse cx="172" cy="252" rx="21" ry="31" fill="#D69A74"/>
    <ellipse cx="340" cy="252" rx="21" ry="31" fill="#C98C68"/>
  </g>
  <path d="M 168 236 Q 160 252 170 268" fill="none" stroke="#9E6A4E" stroke-width="4" stroke-linecap="round"/>
  <path d="M 344 236 Q 352 252 342 268" fill="none" stroke="#9E6A4E" stroke-width="4" stroke-linecap="round"/>
  <circle cx="168" cy="276" r="4.5" fill="#E8EDF5" stroke="#120E1A" stroke-width="2"/>

  <!-- YÜZ -->
  <path d="M 170 205 C 168 258, 176 296, 196 326 C 214 352, 236 366, 256 366 C 276 366, 298 352, 316 326 C 336 296, 344 258, 342 205 C 338 134, 302 106, 256 106 C 210 106, 174 134, 170 205 Z"
        fill="#E2A880" stroke="#120E1A" stroke-width="6"/>
  <!-- gölge (sağ yanak, elmacık altı) -->
  <path d="M 302 124 C 328 152, 340 198, 338 252 C 334 296, 318 330, 294 350 C 312 318, 322 284, 322 242 C 322 196, 316 158, 302 124 Z" fill="#C4876A" opacity="0.75"/>

  <!-- SAKAL: çene hattı boyunca kısa kesim, ayrı bıyık -->
  <path d="M 172 230 C 171 276, 180 304, 198 330 C 216 356, 238 374, 256 374 C 274 374, 296 356, 314 330 C 332 304, 341 276, 340 230 L 328 232 C 328 270, 322 294, 306 314 C 296 326, 288 334, 280 338 C 270 334, 262 333, 256 333 C 250 333, 242 334, 232 338 C 224 334, 216 326, 206 314 C 190 294, 184 270, 184 232 Z"
