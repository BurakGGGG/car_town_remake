  <path d="M 228 303 C 236 293, 250 292, 256 297 C 262 292, 276 293, 284 303 C 280 309, 270 310, 256 305 C 242 310, 232 309, 228 303 Z"
        fill="#24222A" stroke="#120E1A" stroke-width="4" stroke-linejoin="round"/>
  <g fill="none" stroke="#3B3946" stroke-width="3" stroke-linecap="round">
    <path d="M 196 312 q 6 12 14 20"/>
    <path d="M 316 312 q -6 12 -14 20"/>
    <path d="M 246 352 q 10 6 20 0"/>
  </g>
  <!-- ağız: yan gülüş -->
  <path d="M 240 323 Q 258 329 280 317" fill="none" stroke="#120E1A" stroke-width="5" stroke-linecap="round"/>
  <path d="M 280 316 q 5 -1 7 -6" fill="none" stroke="#120E1A" stroke-width="4" stroke-linecap="round"/>
  <path d="M 248 329 Q 260 334 272 328" fill="none" stroke="#B06A55" stroke-width="4" stroke-linecap="round"/>

  <!-- BURUN -->
  <path d="M 262 232 C 266 254, 272 270, 278 282 C 270 292, 252 294, 240 286" fill="none" stroke="#99664B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="250" cy="285" r="3" fill="#7E5038"/>
  <circle cx="268" cy="285" r="3" fill="#7E5038"/>
  <path d="M 252 236 q 2 20 6 32" fill="none" stroke="#F2C7A4" stroke-width="4" stroke-linecap="round"/>

