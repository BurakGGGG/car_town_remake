<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- ELİF USTA — Pamuk Garaj: pastel pembe şeker çizgili duvar, nane tulum, topuz + puantiyeli bandana,
       yuvarlak yüz, çil ve allık. Oyunda daireye kırpılır. -->
  <defs>
    <radialGradient id="bg" cx="256" cy="220" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFEFF4"/>
      <stop offset="0.6" stop-color="#FFD3E2"/>
      <stop offset="1" stop-color="#FFB3CC"/>
    </radialGradient>
    <linearGradient id="suit" x1="0" y1="396" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A6EBD6"/>
      <stop offset="1" stop-color="#7FD8BE"/>
    </linearGradient>
    <linearGradient id="hair" x1="200" y1="40" x2="320" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A85A36"/>
      <stop offset="1" stop-color="#743A22"/>
    </linearGradient>
    <linearGradient id="neck" x1="0" y1="330" x2="0" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DFA285"/>
      <stop offset="1" stop-color="#F2C2A6"/>
    </linearGradient>
    <clipPath id="mouth">
      <path d="M 222 310 Q 256 352 292 310 Q 256 320 222 310 Z"/>
    </clipPath>
  </defs>

  <!-- ARKA PLAN: şeker çizgi duvar + ışıltılar -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <g stroke="#FFFFFF" stroke-width="26" opacity="0.38">
    <path d="M -120 160 L 200 -120"/>
    <path d="M -120 290 L 330 -120"/>
    <path d="M -120 420 L 460 -120"/>
    <path d="M -120 550 L 590 -120"/>
    <path d="M -10 640 L 640 40"/>
    <path d="M 120 640 L 640 170"/>
    <path d="M 250 640 L 640 300"/>
  </g>
  <g stroke="#3B2B3A" stroke-width="3" stroke-linejoin="round">
    <path d="M 88 150 l 7 -18 l 7 18 l 18 7 l -18 7 l -7 18 l -7 -18 l -18 -7 Z" fill="#FFE07A"/>
    <path d="M 414 112 l 5 -13 l 5 13 l 13 5 l -13 5 l -5 13 l -5 -13 l -13 -5 Z" fill="#8FE6CC"/>
    <path d="M 430 300 c -8 -14 -28 -4 -18 12 l 18 18 l 18 -18 c 10 -16 -10 -26 -18 -12 Z" fill="#FF8FB0"/>
    <path d="M 72 330 c -6 -10 -20 -3 -13 9 l 13 13 l 13 -13 c 7 -12 -7 -19 -13 -9 Z" fill="#FFFFFF"/>
  </g>

  <!-- GÖVDE: nane tulum, pembe tişört, yaka, isim etiketi -->
  <g transform="translate(0,-12)">
  <g stroke="#3B2B3A" stroke-width="6" stroke-linejoin="round">
    <path d="M 36 530 C 44 446, 116 406, 212 394 L 300 394 C 396 406, 468 446, 476 530 Z" fill="url(#suit)"/>
    <path d="M 218 396 L 256 446 L 294 396 Z" fill="#FF9DB8"/>
    <path d="M 214 392 L 174 424 L 222 444 L 252 448 Z" fill="#C4F5E6"/>
    <path d="M 298 392 L 338 424 L 290 444 L 260 448 Z" fill="#C4F5E6"/>
  </g>
  <path d="M 256 450 L 256 520" stroke="#5FBFA3" stroke-width="5"/>
  <rect x="249" y="452" width="14" height="22" rx="4" fill="#E9EEF2" stroke="#3B2B3A" stroke-width="3"/>
  <path d="M 70 470 Q 104 432 168 414" fill="none" stroke="#C9F7EA" stroke-width="7" stroke-linecap="round"/>
  <path d="M 442 470 Q 408 432 344 414" fill="none" stroke="#6CCCB0" stroke-width="7" stroke-linecap="round"/>
  <!-- isim etiketi: kalp -->
  <rect x="152" y="452" width="66" height="40" rx="12" fill="#FFFFFF" stroke="#FF7FA6" stroke-width="5"/>
  <path d="M 185 462 c -6 -10 -20 -3 -13 9 l 13 12 l 13 -12 c 7 -12 -7 -19 -13 -9 Z" fill="#FF7FA6"/>

  <!-- BOYUN -->
  <path d="M 220 320 L 220 410 Q 256 430 292 410 L 292 320 Z" fill="url(#neck)" stroke="#3B2B3A" stroke-width="6"/>
  </g>

  <!-- TOPUZ (başın arkasında) -->
  <g stroke="#3B2B3A" stroke-width="6">
    <circle cx="262" cy="88" r="52" fill="url(#hair)"/>
  </g>
  <g fill="none" stroke="#C47447" stroke-width="5" stroke-linecap="round">
    <path d="M 232 70 Q 258 48 286 66"/>
    <path d="M 238 96 Q 262 80 292 92"/>
  </g>

  <!-- ARKA SAÇ: başı çevreleyen hacim -->
  <path d="M 150 246 C 142 168, 190 116, 256 114 C 322 116, 370 168, 362 246 C 360 268, 354 284, 346 296 L 166 296 C 158 284, 152 268, 150 246 Z"
        fill="#6A3420" stroke="#3B2B3A" stroke-width="6" stroke-linejoin="round"/>

  <!-- KULAKLAR + kalp küpe -->
  <g stroke="#3B2B3A" stroke-width="5">
    <ellipse cx="160" cy="266" rx="17" ry="22" fill="#F2C2A6"/>
    <ellipse cx="352" cy="266" rx="17" ry="22" fill="#EDB89B"/>
  </g>
  <path d="M 156 292 c -4 -7 -14 -2 -9 6 l 9 9 l 9 -9 c 5 -8 -5 -13 -9 -6 Z" fill="#FF7FA6" stroke="#3B2B3A" stroke-width="2.5"/>
  <path d="M 356 292 c -4 -7 -14 -2 -9 6 l 9 9 l 9 -9 c 5 -8 -5 -13 -9 -6 Z" fill="#FF7FA6" stroke="#3B2B3A" stroke-width="2.5"/>

  <!-- YÜZ: yuvarlak, tombul yanaklar -->
  <path d="M 160 240 C 156 312, 198 360, 256 362 C 314 360, 356 312, 352 240 C 350 166, 308 128, 256 128 C 204 128, 162 166, 160 240 Z"
        fill="#F8D3B8" stroke="#3B2B3A" stroke-width="6"/>
  <path d="M 318 158 C 340 184, 350 222, 346 262 C 342 304, 322 334, 296 348 C 316 324, 330 294, 332 258 C 334 222, 328 186, 318 158 Z" fill="#EDB396" opacity="0.7"/>

