  <ellipse cx="192" cy="300" rx="24" ry="14" fill="#FF8FAA" opacity="0.55"/>
  <ellipse cx="320" cy="300" rx="24" ry="14" fill="#FF8FAA" opacity="0.55"/>
  <g fill="#C97C5E">
    <circle cx="214" cy="284" r="2.6"/>
    <circle cx="224" cy="292" r="2.2"/>
    <circle cx="206" cy="294" r="2.2"/>
    <circle cx="298" cy="284" r="2.6"/>
    <circle cx="288" cy="292" r="2.2"/>
    <circle cx="306" cy="294" r="2.2"/>
  </g>

  <!-- GÖZLER: iri, parlak -->
  <g>
    <ellipse cx="214" cy="254" rx="19" ry="21" fill="#FFFFFF"/>
    <ellipse cx="298" cy="254" rx="19" ry="21" fill="#FFFFFF"/>
    <circle cx="216" cy="257" r="14" fill="#7A4A26"/>
    <circle cx="296" cy="257" r="14" fill="#7A4A26"/>
    <circle cx="216" cy="261" r="9" fill="#A8703C"/>
    <circle cx="296" cy="261" r="9" fill="#A8703C"/>
    <circle cx="216" cy="257" r="7" fill="#24140C"/>
    <circle cx="296" cy="257" r="7" fill="#24140C"/>
    <circle cx="222" cy="250" r="5" fill="#FFFFFF"/>
    <circle cx="302" cy="250" r="5" fill="#FFFFFF"/>
    <circle cx="211" cy="264" r="2.5" fill="#FFFFFF"/>
    <circle cx="291" cy="264" r="2.5" fill="#FFFFFF"/>
  </g>
  <g fill="none" stroke="#3B2B3A" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 193 254 Q 213 212 235 252" stroke-width="6"/>
    <path d="M 277 252 Q 299 212 319 254" stroke-width="6"/>
    <path d="M 196 245 l -10 -5" stroke-width="4"/>
    <path d="M 200 238 l -7 -9" stroke-width="4"/>
    <path d="M 316 245 l 10 -5" stroke-width="4"/>
    <path d="M 312 238 l 7 -9" stroke-width="4"/>
  </g>
  <!-- KAŞLAR -->
  <g fill="none" stroke="#6A3420" stroke-width="7" stroke-linecap="round">
    <path d="M 192 218 Q 212 206 234 214"/>
    <path d="M 278 214 Q 300 206 320 218"/>
  </g>

  <!-- BURUN -->
  <path d="M 248 284 Q 256 292 266 284" fill="none" stroke="#D99478" stroke-width="5" stroke-linecap="round"/>

  <!-- AĞIZ: kocaman gülüş -->
  <path d="M 222 310 Q 256 352 292 310 Q 256 320 222 310 Z" fill="#8C2F3F"/>
  <g clip-path="url(#mouth)">
    <ellipse cx="258" cy="336" rx="18" ry="10" fill="#FF7E95"/>
    <path d="M 222 306 Q 256 318 292 306 L 292 316 Q 256 328 222 316 Z" fill="#FFFFFF"/>
  </g>
  <path d="M 222 310 Q 256 352 292 310 Q 256 320 222 310 Z" fill="none" stroke="#3B2B3A" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 218 306 q 2 4 6 5" fill="none" stroke="#3B2B3A" stroke-width="4" stroke-linecap="round"/>
  <path d="M 296 306 q -2 4 -6 5" fill="none" stroke="#3B2B3A" stroke-width="4" stroke-linecap="round"/>

  <!-- KAKÜL + yan tutamlar -->
  <path d="M 166 220 C 166 160, 204 130, 256 130 C 308 130, 346 160, 346 220 C 330 206, 318 190, 312 176 C 302 196, 284 206, 262 208 C 272 196, 276 184, 276 172 C 258 196, 230 210, 200 210 C 192 218, 178 222, 166 220 Z"
        fill="url(#hair)" stroke="#3B2B3A" stroke-width="6" stroke-linejoin="round"/>
  <path d="M 164 214 C 156 244, 158 280, 172 304 C 176 280, 176 250, 182 222 Z" fill="url(#hair)" stroke="#3B2B3A" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 348 214 C 356 244, 354 280, 340 304 C 336 280, 336 250, 330 222 Z" fill="url(#hair)" stroke="#3B2B3A" stroke-width="5" stroke-linejoin="round"/>
  <g fill="none" stroke="#C47447" stroke-width="4" stroke-linecap="round">
    <path d="M 200 158 Q 226 144 252 146"/>
    <path d="M 290 152 Q 312 160 326 178"/>
  </g>

  <!-- BANDANA: pembe puantiyeli, tepede fiyonk düğüm -->
  <path d="M 172 168 C 190 126, 222 110, 256 110 C 290 110, 322 126, 340 168 C 336 176, 330 180, 324 178 C 308 146, 284 134, 256 134 C 228 134, 204 146, 188 178 C 182 180, 176 176, 172 168 Z"
        fill="#FF7FA6" stroke="#3B2B3A" stroke-width="6" stroke-linejoin="round"/>
  <g stroke="#3B2B3A" stroke-width="5" stroke-linejoin="round">
    <path d="M 312 120 C 318 92, 340 78, 358 86 C 362 104, 344 122, 318 126 Z" fill="#FF7FA6"/>
    <path d="M 316 124 C 334 124, 360 132, 366 150 C 350 160, 330 146, 316 130 Z" fill="#FF7FA6"/>
    <circle cx="314" cy="124" r="10" fill="#FF6B98"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="200" cy="146" r="4.5"/>
    <circle cx="228" cy="126" r="4.5"/>
    <circle cx="258" cy="120" r="4.5"/>
    <circle cx="288" cy="126" r="4.5"/>
    <circle cx="246" cy="128" r="3"/>
    <circle cx="214" cy="140" r="3"/>
    <circle cx="336" cy="96" r="4"/>
    <circle cx="346" cy="108" r="3"/>
    <circle cx="344" cy="140" r="4"/>
  </g>
</svg>
